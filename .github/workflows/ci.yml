name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Check JavaScript and Lambda syntax
        run: |
          find website scripts -type f \( -name "*.js" -o -name "*.mjs" \) -print0 | xargs -0 -n1 node --check
          python -m py_compile lambda/contact/app.py

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra

      - name: Validate bootstrap Terraform
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate site Terraform
        working-directory: infra/site
        run: |
          terraform init -backend=false
          terraform validate

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform plan
        working-directory: infra/site
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=site/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

          terraform plan \
            -var="contact_to_email=${{ secrets.CONTACT_TO_EMAIL }}" \
            -var="contact_from_email=${{ secrets.CONTACT_FROM_EMAIL }}"
